[tools]
go = "1.25.3"

[tasks.build]
description = "Build the go-text-yaml-gen binary into ./bin/"
run = "go build -o ./bin/go-text-yaml-gen ."

[tasks.generate]
description = "Regenerate testdata/golden from example/ (update fixtures)"
run = "go run . -o ./testdata/golden ./example"


# ── Consumer project example ──────────────────────────────────────────────────
